<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D智慧实验室安全与实验流程调度可视化平台</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', sans-serif;
            overflow: hidden;
            background: #0a0a1a;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(10, 10, 26, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }

        .loading-spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(0, 212, 255, 0.2);
            border-top-color: #00d4ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            color: #00d4ff;
            margin-top: 20px;
            font-size: 16px;
        }

        .header {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: linear-gradient(90deg, rgba(20, 40, 80, 0.95), rgba(10, 20, 50, 0.95));
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
            z-index: 100;
            border-bottom: 2px solid #00d4ff;
            box-shadow: 0 2px 20px rgba(0, 212, 255, 0.3);
        }

        .header h1 {
            color: #00d4ff;
            font-size: 20px;
            font-weight: 600;
            text-shadow: 0 0 10px rgba(0, 212, 255, 0.5);
        }

        .header-info {
            display: flex;
            gap: 30px;
            color: #a0c4ff;
            font-size: 14px;
        }

        .header-info span {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #00ff88;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .sidebar {
            position: absolute;
            top: 60px;
            left: 0;
            width: 280px;
            bottom: 0;
            background: rgba(15, 25, 50, 0.95);
            border-right: 1px solid rgba(0, 212, 255, 0.3);
            padding: 15px;
            overflow-y: auto;
            z-index: 90;
        }

        .sidebar-section {
            margin-bottom: 20px;
        }

        .sidebar-title {
            color: #00d4ff;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 10px;
            padding-bottom: 6px;
            border-bottom: 1px solid rgba(0, 212, 255, 0.3);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .stat-card {
            background: rgba(0, 212, 255, 0.1);
            border-radius: 6px;
            padding: 10px;
            margin-bottom: 8px;
            border-left: 3px solid #00d4ff;
        }

        .stat-card.warning {
            background: rgba(255, 165, 0, 0.1);
            border-left-color: #ffa500;
        }

        .stat-card.danger {
            background: rgba(255, 68, 68, 0.1);
            border-left-color: #ff4444;
            animation: danger-pulse 1s infinite;
        }

        @keyframes danger-pulse {
            0%, 100% { box-shadow: 0 0 5px rgba(255, 68, 68, 0.5); }
            50% { box-shadow: 0 0 15px rgba(255, 68, 68, 0.8); }
        }

        .stat-label {
            color: #8899aa;
            font-size: 11px;
            margin-bottom: 3px;
        }

        .stat-value {
            color: #ffffff;
            font-size: 18px;
            font-weight: 600;
        }

        .stat-value.warning {
            color: #ffa500;
        }

        .stat-value.danger {
            color: #ff4444;
        }

        .right-panel {
            position: absolute;
            top: 60px;
            right: 0;
            width: 320px;
            bottom: 0;
            background: rgba(15, 25, 50, 0.95);
            border-left: 1px solid rgba(0, 212, 255, 0.3);
            padding: 15px;
            overflow-y: auto;
            z-index: 90;
        }

        .tab-container {
            display: flex;
            gap: 4px;
            margin-bottom: 12px;
        }

        .tab-btn {
            flex: 1;
            padding: 6px 8px;
            background: rgba(0, 212, 255, 0.1);
            border: 1px solid rgba(0, 212, 255, 0.3);
            color: #8899aa;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            transition: all 0.3s;
        }

        .tab-btn.active {
            background: rgba(0, 212, 255, 0.3);
            color: #00d4ff;
            border-color: #00d4ff;
        }

        .tab-btn:hover {
            background: rgba(0, 212, 255, 0.2);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .alert-item {
            background: rgba(255, 68, 68, 0.1);
            border: 1px solid rgba(255, 68, 68, 0.3);
            border-radius: 6px;
            padding: 10px;
            margin-bottom: 8px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .alert-item:hover {
            transform: translateX(3px);
        }

        .alert-item.warning {
            background: rgba(255, 165, 0, 0.1);
            border-color: rgba(255, 165, 0, 0.3);
        }

        .alert-item.success {
            background: rgba(0, 255, 136, 0.1);
            border-color: rgba(0, 255, 136, 0.3);
        }

        .alert-item.info {
            background: rgba(0, 212, 255, 0.1);
            border-color: rgba(0, 212, 255, 0.3);
        }

        .alert-title {
            color: #ff4444;
            font-weight: 600;
            margin-bottom: 3px;
        }

        .alert-item.warning .alert-title {
            color: #ffa500;
        }

        .alert-item.success .alert-title {
            color: #00ff88;
        }

        .alert-item.info .alert-title {
            color: #00d4ff;
        }

        .alert-desc {
            color: #aabbcc;
            font-size: 11px;
        }

        .alert-time {
            color: #667788;
            font-size: 10px;
            margin-top: 5px;
        }

        .bottom-panel {
            position: absolute;
            bottom: 0;
            left: 280px;
            right: 320px;
            height: 160px;
            background: rgba(15, 25, 50, 0.95);
            border-top: 1px solid rgba(0, 212, 255, 0.3);
            padding: 12px 15px;
            z-index: 90;
            overflow-x: auto;
        }

        .schedule-container {
            display: flex;
            gap: 12px;
            height: 100%;
        }

        .schedule-item {
            flex: 1;
            min-width: 180px;
            background: rgba(0, 212, 255, 0.05);
            border-radius: 6px;
            padding: 10px;
            border: 1px solid rgba(0, 212, 255, 0.2);
        }

        .schedule-header {
            color: #00d4ff;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .schedule-booking {
            background: rgba(0, 212, 255, 0.15);
            border-radius: 4px;
            padding: 6px;
            margin-bottom: 5px;
            font-size: 11px;
            border-left: 3px solid #00d4ff;
            cursor: pointer;
            transition: all 0.3s;
        }

        .schedule-booking:hover {
            background: rgba(0, 212, 255, 0.25);
        }

        .schedule-booking.conflict {
            border-left-color: #ff4444;
            background: rgba(255, 68, 68, 0.15);
        }

        .booking-time {
            color: #00d4ff;
            font-weight: 600;
        }

        .booking-project {
            color: #ffffff;
            margin: 2px 0;
        }

        .booking-person {
            color: #8899aa;
            font-size: 10px;
        }

        .controls {
            position: absolute;
            top: 75px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            z-index: 100;
        }

        .control-btn {
            padding: 6px 12px;
            background: rgba(20, 40, 80, 0.9);
            border: 1px solid rgba(0, 212, 255, 0.5);
            color: #00d4ff;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s;
        }

        .control-btn:hover {
            background: rgba(0, 212, 255, 0.3);
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.5);
        }

        .control-btn.primary {
            background: rgba(0, 212, 255, 0.3);
        }

        .control-btn.danger {
            border-color: rgba(255, 68, 68, 0.5);
            color: #ff4444;
        }

        .control-btn.danger:hover {
            background: rgba(255, 68, 68, 0.2);
            box-shadow: 0 0 15px rgba(255, 68, 68, 0.5);
        }

        .info-tooltip {
            position: absolute;
            background: rgba(20, 40, 80, 0.95);
            border: 1px solid #00d4ff;
            border-radius: 6px;
            padding: 12px;
            color: #ffffff;
            font-size: 12px;
            z-index: 200;
            pointer-events: none;
            display: none;
            min-width: 180px;
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.3);
        }

        .info-tooltip h3 {
            color: #00d4ff;
            margin-bottom: 8px;
            font-size: 13px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
        }

        .info-label {
            color: #8899aa;
        }

        .info-value {
            color: #ffffff;
            font-weight: 500;
        }

        .info-value.warning {
            color: #ffa500;
        }

        .info-value.danger {
            color: #ff4444;
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: linear-gradient(135deg, #1a2a4a, #0d1a30);
            border: 1px solid #00d4ff;
            border-radius: 10px;
            padding: 25px;
            max-width: 550px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 0 40px rgba(0, 212, 255, 0.3);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(0, 212, 255, 0.3);
        }

        .modal-title {
            color: #00d4ff;
            font-size: 18px;
            font-weight: 600;
        }

        .modal-close {
            background: none;
            border: none;
            color: #8899aa;
            font-size: 22px;
            cursor: pointer;
            transition: color 0.3s;
        }

        .modal-close:hover {
            color: #ff4444;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-label {
            color: #a0c4ff;
            font-size: 12px;
            margin-bottom: 5px;
            display: block;
        }

        .form-input, .form-select, .form-textarea {
            width: 100%;
            padding: 8px 10px;
            background: rgba(0, 212, 255, 0.1);
            border: 1px solid rgba(0, 212, 255, 0.3);
            border-radius: 5px;
            color: #ffffff;
            font-size: 13px;
            font-family: inherit;
        }

        .form-input:focus, .form-select:focus, .form-textarea:focus {
            outline: none;
            border-color: #00d4ff;
            box-shadow: 0 0 8px rgba(0, 212, 255, 0.3);
        }

        .form-textarea {
            resize: vertical;
            min-height: 70px;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 20px;
        }

        .btn {
            padding: 8px 20px;
            border-radius: 5px;
            border: none;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(90deg, #00d4ff, #0099cc);
            color: #ffffff;
        }

        .btn-primary:hover {
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.5);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: #a0c4ff;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .btn-danger {
            background: linear-gradient(90deg, #ff4444, #cc3333);
            color: #ffffff;
        }

        .btn-success {
            background: linear-gradient(90deg, #00ff88, #00cc6a);
            color: #ffffff;
        }

        .order-item, .workorder-item {
            background: rgba(0, 212, 255, 0.05);
            border: 1px solid rgba(0, 212, 255, 0.2);
            border-radius: 6px;
            padding: 10px;
            margin-bottom: 8px;
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .order-id {
            color: #00d4ff;
            font-weight: 600;
            font-size: 12px;
        }

        .order-status {
            padding: 2px 8px;
            border-radius: 8px;
            font-size: 10px;
            font-weight: 500;
        }

        .order-status.pending {
            background: rgba(255, 165, 0, 0.2);
            color: #ffa500;
        }

        .order-status.approved {
            background: rgba(0, 255, 136, 0.2);
            color: #00ff88;
        }

        .order-status.completed {
            background: rgba(0, 212, 255, 0.2);
            color: #00d4ff;
        }

        .order-status.processing {
            background: rgba(100, 150, 255, 0.2);
            color: #88aaff;
        }

        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2);
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(0, 212, 255, 0.5);
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(0, 212, 255, 0.7);
        }

        .toast {
            position: fixed;
            top: 80px;
            right: 340px;
            padding: 12px 20px;
            border-radius: 6px;
            color: white;
            font-size: 13px;
            z-index: 2000;
            transform: translateX(400px);
            transition: transform 0.3s ease;
        }

        .toast.show {
            transform: translateX(0);
        }

        .toast.success {
            background: rgba(0, 204, 106, 0.9);
        }

        .toast.error {
            background: rgba(255, 68, 68, 0.9);
        }

        .toast.warning {
            background: rgba(255, 165, 0, 0.9);
        }

        .toast.info {
            background: rgba(0, 212, 255, 0.9);
        }
    </style>
</head>
<body>
    <div class="loading-overlay" id="loading">
        <div class="loading-spinner"></div>
        <div class="loading-text">正在连接后端服务器...</div>
    </div>

    <div id="canvas-container"></div>

    <div class="toast" id="toast"></div>

    <div class="header">
        <h1>🔬 3D智慧实验室安全与实验流程调度可视化平台</h1>
        <div class="header-info">
            <span><span class="status-dot"></span> <span id="api-status">连接中...</span></span>
            <span>📅 <span id="current-date">2024-01-15</span></span>
            <span>🕐 <span id="current-time">09:30:00</span></span>
        </div>
    </div>

    <div class="controls">
        <button class="control-btn primary" onclick="resetCamera()">重置视角</button>
        <button class="control-btn" onclick="toggleRotation()">自动旋转</button>
        <button class="control-btn" onclick="refreshData()">🔄 刷新数据</button>
        <button class="control-btn" onclick="showStatistics()">📊 数据统计</button>
        <button class="control-btn" onclick="exportExcel()">📥 导出Excel</button>
        <button class="control-btn danger" onclick="simulateAlert()">⚠️ 模拟警报</button>
    </div>

    <div class="sidebar">
        <div class="sidebar-section">
            <div class="sidebar-title">📊 实时数据概览</div>
            <div class="stat-card">
                <div class="stat-label">在线实验台</div>
                <div class="stat-value" id="stat-tables">6 / 6</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">运行中仪器</div>
                <div class="stat-value" id="stat-instruments">4 / 5</div>
            </div>
            <div class="stat-card warning">
                <div class="stat-label">试剂低库存</div>
                <div class="stat-value warning" id="stat-low-reagent">0</div>
            </div>
            <div class="stat-card danger" id="alert-stat">
                <div class="stat-label">活跃警报</div>
                <div class="stat-value danger" id="stat-alerts">0</div>
            </div>
        </div>

        <div class="sidebar-section">
            <div class="sidebar-title">🌡️ 环境监测</div>
            <div class="stat-card">
                <div class="stat-label">实验室温度</div>
                <div class="stat-value">23.5°C</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">实验室湿度</div>
                <div class="stat-value">45%</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">PM2.5</div>
                <div class="stat-value">12 μg/m³</div>
            </div>
        </div>

        <div class="sidebar-section">
            <div class="sidebar-title">👥 人员信息</div>
            <div class="stat-card">
                <div class="stat-label">在场人员</div>
                <div class="stat-value">8 人</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">P3授权人员</div>
                <div class="stat-value" id="stat-authorized">3 人</div>
            </div>
        </div>
    </div>

    <div class="right-panel">
        <div class="tab-container">
            <button class="tab-btn active" onclick="switchTab('alerts')">🚨 警报</button>
            <button class="tab-btn" onclick="switchTab('orders')">📦 采购</button>
            <button class="tab-btn" onclick="switchTab('workorders')">🔧 工单</button>
        </div>

        <div class="tab-content active" id="tab-alerts">
            <div id="alerts-list"></div>
        </div>

        <div class="tab-content" id="tab-orders">
            <div id="orders-list"></div>
        </div>

        <div class="tab-content" id="tab-workorders">
            <div id="workorders-list"></div>
        </div>
    </div>

    <div class="bottom-panel">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
            <div class="sidebar-title" style="margin-bottom: 0;">📋 今日实验预约调度</div>
            <button class="control-btn" onclick="autoAdjustScheduleClick()" style="padding: 4px 12px; font-size: 11px;">🔄 自动调整冲突</button>
        </div>
        <div class="schedule-container" id="schedule-container"></div>
    </div>

    <div class="info-tooltip" id="info-tooltip"></div>

    <div class="modal" id="statistics-modal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">📊 数据统计报表</div>
                <button class="modal-close" onclick="closeModal('statistics-modal')">&times;</button>
            </div>
            <div id="statistics-content">
                <div style="text-align: center; color: #8899aa; padding: 30px;">加载中...</div>
            </div>
        </div>
    </div>

    <div class="modal" id="purchase-modal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">📦 采购申请单</div>
                <button class="modal-close" onclick="closeModal('purchase-modal')">&times;</button>
            </div>
            <div class="form-group">
                <label class="form-label">申请单号</label>
                <input type="text" class="form-input" id="purchase-id" readonly>
            </div>
            <div class="form-group">
                <label class="form-label">试剂名称</label>
                <input type="text" class="form-input" id="purchase-reagent" readonly>
            </div>
            <div class="form-group">
                <label class="form-label">当前剩余量</label>
                <input type="text" class="form-input" id="purchase-current" readonly>
            </div>
            <div class="form-group">
                <label class="form-label">建议采购量</label>
                <input type="text" class="form-input" id="purchase-suggested" readonly>
            </div>
            <div class="form-group">
                <label class="form-label">实际采购量</label>
                <input type="text" class="form-input" id="purchase-amount">
            </div>
            <div class="form-group">
                <label class="form-label">备注</label>
                <textarea class="form-textarea" id="purchase-remark">试剂库存低于20%阈值，系统自动生成采购申请</textarea>
            </div>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeModal('purchase-modal')">取消</button>
                <button class="btn btn-primary" onclick="submitPurchase()">提交申请</button>
            </div>
        </div>
    </div>

    <div class="modal" id="maintenance-modal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">🔧 保养工单</div>
                <button class="modal-close" onclick="closeModal('maintenance-modal')">&times;</button>
            </div>
            <div class="form-group">
                <label class="form-label">工单号</label>
                <input type="text" class="form-input" id="maint-id" readonly>
            </div>
            <div class="form-group">
                <label class="form-label">仪器名称</label>
                <input type="text" class="form-input" id="maint-instrument" readonly>
            </div>
            <div class="form-group">
                <label class="form-label">累计运行时间</label>
                <input type="text" class="form-input" id="maint-runtime" readonly>
            </div>
            <div class="form-group">
                <label class="form-label">保养类型</label>
                <select class="form-select" id="maint-type">
                    <option>常规保养</option>
                    <option>深度保养</option>
                    <option>部件更换</option>
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">预计完成时间</label>
                <input type="date" class="form-input" id="maint-date">
            </div>
            <div class="form-group">
                <label class="form-label">保养说明</label>
                <textarea class="form-textarea" id="maint-desc">仪器累计运行时间超过保养阈值，需要进行保养维护</textarea>
            </div>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeModal('maintenance-modal')">取消</button>
                <button class="btn btn-primary" onclick="submitMaintenance()">创建工单</button>
            </div>
        </div>
    </div>

    <div class="modal" id="access-modal">
        <div class="modal-content" style="max-width: 380px; text-align: center;">
            <div class="modal-header">
                <div class="modal-title">👤 P3实验室门禁系统</div>
                <button class="modal-close" onclick="closeModal('access-modal')">&times;</button>
            </div>
            <div id="face-scan-area" style="width: 180px; height: 180px; margin: 15px auto; border: 3px solid #00d4ff; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: rgba(0,212,255,0.1);">
                <span style="font-size: 50px;">📷</span>
            </div>
            <div id="access-status" style="color: #a0c4ff; font-size: 15px; margin-bottom: 15px;">请进行人脸识别...</div>
            <div class="form-group">
                <label class="form-label">选择人员模拟</label>
                <select class="form-select" id="person-select">
                    <option value="张博士">张博士 (已授权)</option>
                    <option value="李研究员">李研究员 (已授权)</option>
                    <option value="王主任">王主任 (已授权)</option>
                    <option value="王实习生">王实习生 (未授权)</option>
                    <option value="外来人员">外来人员 (未授权)</option>
                </select>
            </div>
            <button class="btn btn-primary" onclick="simulateFaceScan()" style="width: 100%;">开始人脸识别</button>
        </div>
    </div>

    <script>
      window.onerror = function(message, source, lineno, colno, error) {
        console.error('全局错误:', message, '行:', lineno, '列:', colno);
        const loading = document.getElementById('loading');
        if (loading) {
          loading.innerHTML = '<div style="color:#ff4444; padding:20px;"><h3>❌ 页面加载错误</h3><p>' + message + '</p><p>行: ' + lineno + ', 列: ' + colno + '</p></div>';
        }
        return true;
      };
    </script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" onerror="this.onerror=null; document.getElementById('loading').innerHTML='<div style=\\'color:#ff4444;padding:20px;\\'><h3>❌ Three.js加载失败</h3><p>请检查网络连接</p></div>';"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js" onerror="this.onerror=null; console.warn('OrbitControls加载失败');"></script>
    <script src="app.js" onerror="this.onerror=null; document.getElementById('loading').innerHTML='<div style=\\'color:#ff4444;padding:20px;\\'><h3>❌ app.js加载失败</h3><p>请检查JavaScript代码</p></div>';"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}网页归档工具{% endblock %}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f0f2f5; color: #333; min-height: 100vh; }
        .navbar { background: #1a1a2e; padding: 0 2rem; display: flex; align-items: center; height: 56px; box-shadow: 0 2px 8px rgba(0,0,0,.15); }
        .navbar a { color: #e0e0e0; text-decoration: none; margin-right: 1.5rem; font-size: .95rem; transition: color .2s; }
        .navbar a:hover, .navbar a.active { color: #4fc3f7; }
        .navbar .brand { font-size: 1.15rem; font-weight: 600; color: #fff; margin-right: 2rem; }
        .container { max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
        .card { background: #fff; border-radius: 10px; padding: 2rem; box-shadow: 0 1px 4px rgba(0,0,0,.08); margin-bottom: 1.5rem; }
        .card h2 { margin-bottom: 1rem; font-size: 1.25rem; color: #1a1a2e; }
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; margin-bottom: .35rem; font-weight: 500; font-size: .9rem; color: #555; }
        .form-group input[type="text"],
        .form-group input[type="number"],
        .form-group input[type="file"],
        .form-group select { width: 100%; padding: .6rem .8rem; border: 1px solid #d0d0d0; border-radius: 6px; font-size: .95rem; transition: border .2s; }
        .form-group input:focus, .form-group select:focus { border-color: #4fc3f7; outline: none; }
        .form-row { display: flex; gap: 1rem; }
        .form-row .form-group { flex: 1; }
        .checkbox-group { display: flex; align-items: center; gap: .5rem; margin-bottom: 1rem; }
        .checkbox-group input[type="checkbox"] { width: 18px; height: 18px; accent-color: #4fc3f7; }
        .checkbox-group label { font-size: .9rem; color: #555; cursor: pointer; }
        .btn { display: inline-block; padding: .65rem 1.5rem; border: none; border-radius: 6px; font-size: .95rem; cursor: pointer; transition: background .2s, transform .1s; }
        .btn:active { transform: scale(.97); }
        .btn-primary { background: #1a1a2e; color: #fff; }
        .btn-primary:hover { background: #16213e; }
        .btn-danger { background: #e74c3c; color: #fff; }
        .btn-danger:hover { background: #c0392b; }
        .btn-sm { padding: .35rem .8rem; font-size: .82rem; }
        .flash-messages { margin-bottom: 1rem; }
        .flash-messages .alert { padding: .75rem 1rem; border-radius: 6px; margin-bottom: .5rem; font-size: .9rem; }
        .alert-success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .alert-error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: .65rem .8rem; text-align: left; border-bottom: 1px solid #eee; font-size: .88rem; }
        th { background: #f8f9fa; color: #555; font-weight: 600; }
        tr:hover td { background: #f5f7fa; }
        .status-success { color: #27ae60; font-weight: 600; }
        .status-failed { color: #e74c3c; font-weight: 600; }
        .empty-state { text-align: center; padding: 3rem 1rem; color: #999; }
        .empty-state p { font-size: 1rem; }
        .actions { display: flex; gap: .5rem; }
        .file-upload-area { border: 2px dashed #d0d0d0; border-radius: 8px; padding: 2rem; text-align: center; cursor: pointer; transition: border-color .2s, background .2s; }
        .file-upload-area:hover { border-color: #4fc3f7; background: #f0f9ff; }
        .file-upload-area p { color: #888; font-size: .9rem; }
        .file-upload-area input[type="file"] { display: none; }
    </style>
</head>
<body>
    <nav class="navbar">
        <span class="brand">📦 网页归档工具</span>
        <a href="{{ url_for('index') }}" class="{% if request.endpoint == 'index' %}active{% endif %}">单页归档</a>
        <a href="{{ url_for('batch') }}" class="{% if request.endpoint == 'batch' %}active{% endif %}">批量归档</a>
        <a href="{{ url_for('history') }}" class="{% if request.endpoint == 'history' %}active{% endif %}">归档记录</a>
    </nav>
    <div class="container">
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        <div class="flash-messages">
            {% for category, message in messages %}
            <div class="alert alert-{{ category }}">{{ message }}</div>
            {% endfor %}
        </div>
        {% endif %}
        {% endwith %}
        {% block content %}{% endblock %}
    </div>
</body>
</html>

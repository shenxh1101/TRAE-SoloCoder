<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>企业档案管理与借阅平台</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--primary:#2563eb;--primary-dark:#1d4ed8;--success:#16a34a;--warning:#d97706;--danger:#dc2626;--info:#0891b2;--bg:#f1f5f9;--card:#fff;--text:#1e293b;--text-light:#64748b;--border:#e2e8f0;--shadow:0 1px 3px rgba(0,0,0,.1);--radius:8px}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#1e3a5f 0%,#2563eb 100%)}
.login-box{background:#fff;border-radius:16px;padding:48px 40px;width:400px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.login-box h1{text-align:center;color:var(--primary);margin-bottom:8px;font-size:24px}
.login-box p{text-align:center;color:var(--text-light);margin-bottom:32px;font-size:14px}
.login-box .hint{background:#f0f9ff;border-radius:8px;padding:12px 16px;margin-top:20px;font-size:12px;color:var(--info)}
.login-box .hint b{color:var(--primary)}
.app-wrap{display:flex;min-height:100vh}
.sidebar{width:240px;background:linear-gradient(180deg,#1e293b 0%,#0f172a 100%);color:#fff;padding:0;flex-shrink:0;position:fixed;height:100vh;overflow-y:auto}
.sidebar .logo{padding:24px 20px;border-bottom:1px solid rgba(255,255,255,.1);font-size:16px;font-weight:700}
.sidebar .logo span{color:#60a5fa}
.sidebar nav{padding:12px 0}
.sidebar nav a{display:flex;align-items:center;padding:12px 20px;color:#94a3b8;text-decoration:none;transition:.2s;font-size:14px;gap:10px}
.sidebar nav a:hover,.sidebar nav a.active{background:rgba(255,255,255,.08);color:#fff}
.sidebar nav a.active{border-right:3px solid var(--primary)}
.sidebar .user-info{padding:16px 20px;border-top:1px solid rgba(255,255,255,.1);font-size:12px;color:#94a3b8}
.sidebar .user-info .name{color:#fff;font-size:14px;font-weight:600;margin-bottom:4px}
.main{flex:1;margin-left:240px;padding:24px 32px}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}
.header h2{font-size:22px;font-weight:700}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:12px;font-weight:600}
.badge-public{background:#dcfce7;color:#16a34a}
.badge-internal{background:#fef3c7;color:#d97706}
.badge-confidential{background:#fee2e2;color:#dc2626}
.badge-pending{background:#fef3c7;color:#d97706}
.badge-approved{background:#dcfce7;color:#16a34a}
.badge-rejected{background:#fee2e2;color:#dc2626}
.badge-returned{background:#e0f2fe;color:#0891b2}
.badge-overdue{background:#fee2e2;color:#dc2626}
.badge-active{background:#dcfce7;color:#16a34a}
.badge-destroyed{background:#f1f5f9;color:#64748b}
.badge-pending_destruction{background:#fef3c7;color:#d97706}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-bottom:24px}
.card{background:var(--card);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.card .label{color:var(--text-light);font-size:13px;margin-bottom:4px}
.card .value{font-size:28px;font-weight:700}
.card .value.blue{color:var(--primary)}
.card .value.green{color:var(--success)}
.card .value.orange{color:var(--warning)}
.card .value.red{color:var(--danger)}
.table-wrap{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin-bottom:24px}
.table-header{padding:16px 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border)}
.table-header h3{font-size:16px;font-weight:600}
table{width:100%;border-collapse:collapse}
th{background:#f8fafc;padding:12px 16px;text-align:left;font-size:13px;color:var(--text-light);font-weight:600;white-space:nowrap}
td{padding:12px 16px;border-top:1px solid var(--border);font-size:14px}
tr:hover td{background:#f8fafc}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border:none;border-radius:6px;cursor:pointer;font-size:13px;font-weight:500;transition:.2s;text-decoration:none}
.btn-primary{background:var(--primary);color:#fff}.btn-primary:hover{background:var(--primary-dark)}
.btn-success{background:var(--success);color:#fff}.btn-success:hover{background:#15803d}
.btn-danger{background:var(--danger);color:#fff}.btn-danger:hover{background:#b91c1c}
.btn-warning{background:var(--warning);color:#fff}.btn-warning:hover{background:#b45309}
.btn-sm{padding:4px 10px;font-size:12px}
.btn-outline{background:#fff;color:var(--primary);border:1px solid var(--primary)}.btn-outline:hover{background:var(--primary);color:#fff}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:13px;font-weight:500;margin-bottom:6px;color:var(--text)}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:6px;font-size:14px;transition:.2s}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(37,99,235,.1)}
.form-group textarea{resize:vertical;min-height:80px}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:1000}
.modal{background:#fff;border-radius:12px;padding:28px;width:500px;max-width:90vw;max-height:85vh;overflow-y:auto}
.modal h3{margin-bottom:20px;font-size:18px}
.modal .actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
.search-bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.search-bar input,.search-bar select{padding:8px 12px;border:1px solid var(--border);border-radius:6px;font-size:13px}
.search-bar input{width:200px}
.notif-dot{display:inline-block;width:8px;height:8px;background:var(--danger);border-radius:50%;margin-left:4px}
.empty{text-align:center;padding:40px;color:var(--text-light)}
.toast{position:fixed;top:20px;right:20px;padding:14px 20px;border-radius:8px;color:#fff;font-size:14px;z-index:2000;animation:slideIn .3s}
.toast-success{background:var(--success)}.toast-error{background:var(--danger)}.toast-info{background:var(--primary)}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
.pagination{display:flex;gap:6px;justify-content:center;margin-top:16px}
.pagination button{padding:6px 12px;border:1px solid var(--border);border-radius:4px;background:#fff;cursor:pointer;font-size:13px}
.pagination button.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.pagination button:disabled{opacity:.5;cursor:default}
.refresh-indicator{font-size:12px;color:var(--text-light)}
.refresh-indicator .dot{display:inline-block;width:6px;height:6px;background:var(--success);border-radius:50%;margin-right:4px;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:24px}
@media(max-width:768px){.two-col{grid-template-columns:1fr}.cards{grid-template-columns:1fr 1fr}.sidebar{display:none}.main{margin-left:0}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const API='';
let token=localStorage.getItem('token')||'';
let currentUser=null;
let currentPage='dashboard';
let dashRefreshTimer=null;

function headers(){return {'Authorization':'Bearer '+token,'Content-Type':'application/json'}}
function headersForm(){return {'Authorization':'Bearer '+token}}

async function api(path,opts={}){
  const url=API+path;
  const h=opts.upload?headersForm():headers();
  if(!opts.upload)opts.body=opts.body?JSON.stringify(opts.body):undefined;
  const res=await fetch(url,{...opts,headers:h});
  if(res.status===401){logout();return null}
  if(res.status===204)return null;
  const data=await res.json().catch(()=>null);
  if(!res.ok){showToast(data?.detail||'请求失败','error');return null}
  return data;
}

function showToast(msg,type='info'){
  const d=document.createElement('div');
  d.className='toast toast-'+type;d.textContent=msg;
  document.body.appendChild(d);
  setTimeout(()=>d.remove(),3000);
}

let confirmResolve=null;
function confirmDialog(msg){
  const overlay=document.createElement('div');
  overlay.className='modal-overlay';
  overlay.innerHTML=`<div class="modal" style="width:380px"><h3>确认操作</h3><p style="margin-bottom:20px">${msg}</p><div class="actions"><button class="btn btn-outline" id="cf-cancel">取消</button><button class="btn btn-primary" id="cf-ok">确认</button></div></div>`;
  document.body.appendChild(overlay);
  return new Promise(resolve=>{
    document.getElementById('cf-cancel').onclick=()=>{overlay.remove();resolve(false)};
    document.getElementById('cf-ok').onclick=()=>{overlay.remove();resolve(true)};
  });
}

function logout(){
  token='';currentUser=null;localStorage.removeItem('token');
  if(dashRefreshTimer)clearInterval(dashRefreshTimer);
  render();
}

async function login(username,password){
  const res=await fetch(API+'/api/auth/login',{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({username,password})
  });
  if(!res.ok){const d=await res.json();showToast(d.detail||'登录失败','error');return}
  const data=await res.json();
  token=data.access_token;currentUser={id:data.user_id,username:data.username,role:data.role,real_name:data.real_name};
  localStorage.setItem('token',token);
  await loadUserInfo();render();
}

async function loadUserInfo(){
  const d=await api('/api/auth/me');
  if(d)currentUser={...currentUser,...d};
}

function canAccess(classification){
  const map={employee:['public'],supervisor:['public','internal'],executive:['public','internal','confidential'],admin:['public','internal','confidential']};
  return (map[currentUser?.role]||[]).includes(classification);
}

const classificationLabel={public:'公开',internal:'内部',confidential:'机密'};
const statusLabel={pending:'待审批',approved:'已批准',rejected:'已拒绝',returned:'已归还',overdue:'已超期',level1_approved:'一级审批通过',level2_approved:'二级审批通过',completed:'已完成',active:'在库',pending_destruction:'待销毁',destroyed:'已销毁'};
const roleLabel={admin:'管理员',supervisor:'主管',executive:'高管',employee:'普通员工'};

function badge(cls,type){return `<span class="badge badge-${cls}">${type==='classification'?classificationLabel[cls]:(type==='role'?roleLabel[cls]:statusLabel[cls]||cls)}</span>`}
function fmtDate(d){return d?new Date(d).toLocaleString('zh-CN',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}):'-'}
function fmtShort(d){return d?new Date(d).toLocaleDateString('zh-CN'):'-'}

function navigate(page){currentPage=page;render()}

function render(){
  const app=document.getElementById('app');
  if(!token||!currentUser){app.innerHTML=renderLogin();bindLogin();return}
  app.innerHTML=renderApp();bindApp();
  if(currentPage==='dashboard')startDashRefresh();
  else if(dashRefreshTimer){clearInterval(dashRefreshTimer);dashRefreshTimer=null}
}

function startDashRefresh(){
  if(dashRefreshTimer)clearInterval(dashRefreshTimer);
  loadDashboard();
  dashRefreshTimer=setInterval(loadDashboard,10000);
}

function renderLogin(){
  return `<div class="login-wrap"><div class="login-box">
    <h1>📁 企业档案管理平台</h1><p>档案管理与借阅系统</p>
    <div class="form-group"><label>用户名</label><input id="login-user" placeholder="请输入用户名"></div>
    <div class="form-group"><label>密码</label><input id="login-pass" type="password" placeholder="请输入密码"></div>
    <button class="btn btn-primary" style="width:100%;justify-content:center;padding:12px" id="login-btn">登 录</button>
    <div class="hint">演示账号：<b>admin/admin123</b>（管理员）<b>zhangsan/123456</b>（员工）<b>lisi/123456</b>（主管）<b>wangwu/123456</b>（高管）</div>
  </div></div>`;
}

function bindLogin(){
  document.getElementById('login-btn')?.addEventListener('click',async()=>{
    const u=document.getElementById('login-user').value;
    const p=document.getElementById('login-pass').value;
    await login(u,p);
  });
  document.getElementById('login-pass')?.addEventListener('keydown',async e=>{if(e.key==='Enter'){const u=document.getElementById('login-user').value;const p=document.getElementById('login-pass').value;await login(u,p)}});
}

function renderApp(){
  const navItems=[
    {page:'dashboard',icon:'📊',label:'数据看板'},
    {page:'archives',icon:'📁',label:'档案管理'},
    {page:'borrow',icon:'📖',label:'借阅管理'},
    {page:'copy',icon:'🖨️',label:'复印申请'},
    {page:'destruction',icon:'🗑️',label:'销毁管理',roles:['admin','supervisor','executive']},
    {page:'notifications',icon:'🔔',label:'通知中心'},
    {page:'admin',icon:'⚙️',label:'系统管理',roles:['admin']},
  ];
  const navHtml=navItems.filter(n=>!n.roles||n.roles.includes(currentUser.role)).map(n=>
    `<a href="#" class="${currentPage===n.page?'active':''}" data-page="${n.page}">${n.icon} ${n.label}</a>`
  ).join('');
  const pages={dashboard:renderDashboard,archives:renderArchives,borrow:renderBorrow,copy:renderCopy,destruction:renderDestruction,notifications:renderNotifications,admin:renderAdmin};
  const content=(pages[currentPage]||pages.dashboard)();
  return `<div class="app-wrap">
    <aside class="sidebar">
      <div class="logo">📁 <span>档案管理平台</span></div>
      <nav>${navHtml}</nav>
      <div class="user-info"><div class="name">${currentUser.real_name}</div>${badge(currentUser.role,'role')} | <a href="#" id="logout-link" style="color:#94a3b8">退出</a></div>
    </aside>
    <main class="main">${content}</main>
  </div>`;
}

function bindApp(){
  document.querySelectorAll('.sidebar nav a').forEach(a=>{
    a.addEventListener('click',e=>{e.preventDefault();navigate(a.dataset.page)});
  });
  document.getElementById('logout-link')?.addEventListener('click',e=>{e.preventDefault();logout()});
  const binders={dashboard:bindDashboard,archives:bindArchives,borrow:bindBorrow,copy:bindCopy,destruction:bindDestruction,notifications:bindNotifications,admin:bindAdmin};
  (binders[currentPage]||binders.dashboard)();
}

let dashData={stats:{},hot:[],overdue:[],alerts:{}};
async function loadDashboard(){
  const stats=await api('/api/dashboard/stats');
  const hot=await api('/api/dashboard/hot-archives?limit=10');
  const overdue=await api('/api/dashboard/overdue');
  let alerts=null;
  if(currentUser?.role==='admin')alerts=await api('/api/dashboard/retention-alerts');
  if(stats)dashData.stats=stats;
  if(hot)dashData.hot=hot;
  if(overdue)dashData.overdue=overdue;
  if(alerts)dashData.alerts=alerts;
  updateDashboardDom();
}

function updateDashboardDom(){
  const s=dashData.stats;
  document.getElementById('stat-public')&&(document.getElementById('stat-public').textContent=s.public_count||0);
  document.getElementById('stat-internal')&&(document.getElementById('stat-internal').textContent=s.internal_count||0);
  document.getElementById('stat-confidential')&&(document.getElementById('stat-confidential').textContent=s.confidential_count||0);
  document.getElementById('stat-total')&&(document.getElementById('stat-total').textContent=s.total_archives||0);
  document.getElementById('stat-borrowing')&&(document.getElementById('stat-borrowing').textContent=s.active_borrows||0);
  document.getElementById('stat-overdue')&&(document.getElementById('stat-overdue').textContent=s.overdue_count||0);
  document.getElementById('stat-pending')&&(document.getElementById('stat-pending').textContent=s.pending_approvals||0);
  const hotTbody=document.getElementById('hot-tbody');
  if(hotTbody){
    hotTbody.innerHTML=dashData.hot.length?dashData.hot.map((h,i)=>`<tr><td>${i+1}</td><td>${h.archive_no}</td><td>${h.title}</td><td>${badge(h.classification,'classification')}</td><td>${h.borrow_count}</td></tr>`).join(''):'<tr><td colspan="5" class="empty">暂无数据</td></tr>';
  }
  const odTbody=document.getElementById('overdue-tbody');
  if(odTbody){
    odTbody.innerHTML=dashData.overdue.length?dashData.overdue.map(o=>`<tr><td>${o.archive_no}</td><td>${o.archive_title}</td><td>${o.borrower_name}</td><td>${fmtShort(o.due_date)}</td><td style="color:var(--danger)">${o.days_overdue}天</td></tr>`).join(''):'<tr><td colspan="5" class="empty">暂无超期记录</td></tr>';
  }
  const alertTbody=document.getElementById('alert-tbody');
  if(alertTbody&&dashData.alerts){
    const all=[...(dashData.alerts.expiring_soon||[]),...(dashData.alerts.expired||[])];
    alertTbody.innerHTML=all.length?all.map(a=>`<tr><td>${a.archive_no}</td><td>${a.title}</td><td style="color:var(--warning)">${fmtShort(a.retention_end_date)}</td></tr>`).join(''):'<tr><td colspan="3" class="empty">暂无预警</td></tr>';
  }
}

function renderDashboard(){
  const s=dashData.stats;
  const isAdmin=currentUser?.role==='admin';
  return `<div class="header"><h2>📊 数据看板</h2><span class="refresh-indicator"><span class="dot"></span>每10秒自动刷新</span></div>
  <div class="cards">
    <div class="card"><div class="label">公开级档案</div><div class="value green" id="stat-public">${s.public_count||0}</div></div>
    <div class="card"><div class="label">内部级档案</div><div class="value orange" id="stat-internal">${s.internal_count||0}</div></div>
    <div class="card"><div class="label">机密级档案</div><div class="value red" id="stat-confidential">${s.confidential_count||0}</div></div>
    <div class="card"><div class="label">档案总量</div><div class="value blue" id="stat-total">${s.total_archives||0}</div></div>
    <div class="card"><div class="label">当前借阅中</div><div class="value blue" id="stat-borrowing">${s.active_borrows||0}</div></div>
    <div class="card"><div class="label">超期未还</div><div class="value red" id="stat-overdue">${s.overdue_count||0}</div></div>
    <div class="card"><div class="label">待审批</div><div class="value orange" id="stat-pending">${s.pending_approvals||0}</div></div>
  </div>
  <div class="two-col">
    <div class="table-wrap"><div class="table-header"><h3>🔥 借阅热度排行</h3></div><table><thead><tr><th>#</th><th>编号</th><th>名称</th><th>密级</th><th>借阅次数</th></tr></thead><tbody id="hot-tbody"><tr><td colspan="5" class="empty">加载中...</td></tr></tbody></table></div>
    <div class="table-wrap"><div class="table-header"><h3>⚠️ 超期明细</h3></div><table><thead><tr><th>编号</th><th>名称</th><th>借阅人</th><th>到期日</th><th>超期</th></tr></thead><tbody id="overdue-tbody"><tr><td colspan="5" class="empty">加载中...</td></tr></tbody></table></div>
  </div>
  ${isAdmin?`<div class="table-wrap" style="margin-top:24px"><div class="table-header"><h3>⏰ 保管期限预警</h3></div><table><thead><tr><th>编号</th><th>名称</th><th>到期日</th></tr></thead><tbody id="alert-tbody"><tr><td colspan="3" class="empty">加载中...</td></tr></tbody></table></div>`:''}`;
}

function bindDashboard(){}

let archivesList=[];
let archivePage=1;
async function loadArchives(){
  const keyword=document.getElementById('arc-keyword')?.value||'';
  const cls=document.getElementById('arc-classification')?.value||'';
  const dateFrom=document.getElementById('arc-date-from')?.value||'';
  const dateTo=document.getElementById('arc-date-to')?.value||'';
  let url=`/api/archives/?page=${archivePage}&size=15`;
  if(keyword)url+=`&keyword=${encodeURIComponent(keyword)}`;
  if(cls)url+=`&classification=${cls}`;
  if(dateFrom)url+=`&date_from=${dateFrom}`;
  if(dateTo)url+=`&date_to=${dateTo}`;
  archivesList=await api(url)||[];
  renderArchivesTable();
}

function renderArchivesTable(){
  const tbody=document.getElementById('archives-tbody');
  if(!tbody)return;
  tbody.innerHTML=archivesList.length?archivesList.map(a=>{
    const stockInfo=a.available_quantity<=0?'<span style="color:var(--danger)">缺货</span>':a.available_quantity<a.total_quantity?`<span style="color:var(--warning)">${a.available_quantity}/${a.total_quantity}</span>`:`${a.available_quantity}/${a.total_quantity}`;
    return `<tr>
    <td>${a.archive_no}</td><td>${a.title}</td><td>${badge(a.classification,'classification')}</td>
    <td>${a.storage_location}</td><td>${stockInfo}</td><td>${fmtShort(a.entry_date)}</td><td>${badge(a.status,'status')}</td>
    <td>${a.borrow_count}</td>
    <td>${canAccess(a.classification)?`<button class="btn btn-primary btn-sm" data-borrow="${a.id}" ${a.available_quantity<=0?'disabled title="库存不足"':''}>借阅</button> <button class="btn btn-outline btn-sm" data-copy="${a.id}">复印</button>`:'<span style="color:var(--text-light)">无权限</span>'}</td>
  </tr>`}).join(''):'<tr><td colspan="9" class="empty">暂无档案</td></tr>';
}

function renderArchives(){
  return `<div class="header"><h2>📁 档案管理</h2>
    ${['admin','supervisor','executive'].includes(currentUser.role)?'<button class="btn btn-primary" id="add-archive-btn">+ 新增档案</button>':''}
  </div>
  <div class="search-bar">
    <input id="arc-keyword" placeholder="搜索名称/编号..."><select id="arc-classification"><option value="">全部密级</option><option value="public">公开</option><option value="internal">内部</option><option value="confidential">机密</option></select>
    <input id="arc-date-from" type="date" title="起始日期"><input id="arc-date-to" type="date" title="截止日期">
    <button class="btn btn-primary btn-sm" id="arc-search-btn">搜索</button>
    <button class="btn btn-outline btn-sm" id="arc-export-btn">📋 导出借阅明细</button>
  </div>

  const el=document.getElementById('admin-content');if(!el)return;
  if(adminTab==='users'){
    const users=await api('/api/admin/users')||[];
    el.innerHTML=`<div class="table-wrap"><table><thead><tr><th>ID</th><th>用户名</th><th>姓名</th><th>角色</th><th>违规次数</th><th>冻结状态</th><th>状态</th><th>操作</th></tr></thead><tbody>
    ${users.map(u=>`<tr><td>${u.id}</td><td>${u.username}</td><td>${u.real_name}</td><td>${badge(u.role,'role')}</td>
    <td>${u.violation_count}/3</td><td>${u.frozen_until?'冻结至'+fmtShort(u.frozen_until):'正常'}</td>
    <td>${u.is_active?'启用':'禁用'}</td>
    <td><button class="btn btn-sm ${u.is_active?'btn-danger':'btn-success'}" data-toggle="${u.id}">${u.is_active?'禁用':'启用'}</button>
    <button class="btn btn-sm btn-outline" data-reset="${u.id}">重置密码</button></td></tr>`).join('')}
    </tbody></table></div>`;
    el.querySelectorAll('[data-toggle]').forEach(btn=>{
      btn.addEventListener('click',async()=>{await api('/api/admin/users/'+btn.dataset.toggle+'/toggle-active',{method:'PUT'});loadAdminContent()});
    });
    el.querySelectorAll('[data-reset]').forEach(btn=>{
      btn.addEventListener('click',async()=>{
        const np=prompt('请输入新密码：');if(!np)return;
        await api('/api/admin/reset-password/'+btn.dataset.reset+'?new_password='+encodeURIComponent(np),{method:'POST'});
        showToast('密码已重置','success');
      });
    });
  } else {
    const depts=await api('/api/admin/departments')||[];
    el.innerHTML=`<div style="margin-bottom:16px"><button class="btn btn-primary" id="add-dept-btn">+ 新增部门</button></div>
    <div class="table-wrap"><table><thead><tr><th>ID</th><th>部门名称</th><th>月度复印配额</th><th>已使用</th><th>操作</th></tr></thead><tbody>
    ${depts.map(d=>`<tr><td>${d.id}</td><td>${d.name}</td><td>${d.monthly_copy_quota}</td><td>${d.used_copy_quota}</td>
    <td><button class="btn btn-sm btn-outline" data-quota="${d.id}">修改配额</button></td></tr>`).join('')}
    </tbody></table></div>`;
    document.getElementById('add-dept-btn')?.addEventListener('click',async()=>{
      const name=prompt('部门名称：');if(!name)return;
      const quota=parseInt(prompt('月度复印配额：','100'))||100;
      await api('/api/admin/departments',{method:'POST',body:{name,monthly_copy_quota:quota}});
      loadAdminContent();showToast('部门已创建','success');
    });
    el.querySelectorAll('[data-quota]').forEach(btn=>{
      btn.addEventListener('click',async()=>{
        const q=parseInt(prompt('新的月度复印配额：'));if(isNaN(q))return;
        await api('/api/admin/departments/'+btn.dataset.quota+'/quota?quota='+q,{method:'PUT'});
        loadAdminContent();showToast('配额已更新','success');
      });
    });
  }
}

function bindAdmin(){
  loadAdminContent();
  document.getElementById('atab-users')?.addEventListener('click',()=>{adminTab='users';render()});
  document.getElementById('atab-depts')?.addEventListener('click',()=>{adminTab='depts';render()});
}

render();
if(token){loadUserInfo().then(()=>render())}
</script>
</body>
</html>
